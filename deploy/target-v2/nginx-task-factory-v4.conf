# Content is accepted only for authenticated, chain-bound commitments. The
# application independently enforces finite storage and transaction scopes.
location ^~ /api/task-factory/v4/ {
    limit_req zone=flypow_explorer burst=32 nodelay;
    client_max_body_size 1100k;
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    add_header Cache-Control "no-store" always;
}
