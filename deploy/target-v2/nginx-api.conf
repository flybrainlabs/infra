# Include inside the existing TLS server block; keep actual TLS cert settings.
# Same-origin preferred. This /api prefix can never fall through to static HTML.
location ^~ /api/target-mining/v2/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 120s;
    client_max_body_size 5m;
    add_header X-Accel-Buffering no always;
}
# Keep unknown APIs closed while allowing the explicit product API regex.
location /api/ { return 404; }
