# Included inside the existing TLS server. It does not expose private directories.
location ~ ^/api/(product/manifest|tasks(/[^/]+)?|results(/[^/]+(/files/[^/]+)?)?|service-requests(/(session|lookup|confirm-quote|delivery-action|delivery-file))?|operations|my-records|wallet-bindings|economy/(ingest|reconcile|reconcile-chain|operations))$ {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_read_timeout 180s;
    proxy_send_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# Public query projection; no origin can trigger authority maintenance here.
location ^~ /api/explorer/v1/ {
    limit_req zone=flypow_explorer burst=20 nodelay;
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 180s;
    add_header Cache-Control "no-store" always;
}
